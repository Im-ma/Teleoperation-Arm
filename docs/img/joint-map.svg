<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 575" role="img"><title>Human arm to SO-101 joint map</title>
<style>
svg{--s:#5F5E5A;--t:#888780;--b:#B4B2A9;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{fill:#2C2C2A}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.c-gray>rect{fill:#F1EFE8;stroke:#888780;stroke-width:1}
circle.c-pink,.c-pink>rect{fill:#FBEAF0;stroke:#D4537E;stroke-width:1.5}.c-pink text{fill:#72243E}
circle.c-coral,.c-coral>rect{fill:#FAECE7;stroke:#D85A30;stroke-width:1.5}.c-coral text{fill:#712B13}
circle.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#7F77DD;stroke-width:1.5}.c-purple text{fill:#3C3489}
circle.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#BA7517;stroke-width:1.5}.c-amber text{fill:#633806}
circle.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#1D9E75;stroke-width:1.5}.c-teal text{fill:#085041}
circle.c-blue,.c-blue>rect{fill:#E6F1FB;stroke:#378ADD;stroke-width:1.5}.c-blue text{fill:#0C447C}
</style>
<rect width="680" height="575" fill="#FFFFFF"/>
<text class="th" x="140" y="36" text-anchor="middle">You, facing the camera</text>
<text class="th" x="340" y="36" text-anchor="middle">Robot joint</text>
<text class="th" x="530" y="36" text-anchor="middle">SO-101, ready pose</text>
<g fill="none" stroke-width="1.5" stroke-dasharray="4 3">
<path d="M184 70 L262 80 M418 80 L530 130" stroke="#D4537E"/>
<path d="M188 92 L262 135 M418 135 L530 180" stroke="#D85A30"/>
<path d="M186 115 L262 190 M418 190 L530 205" stroke="#7F77DD"/>
<path d="M182 205 L262 245 M418 245 L530 300" stroke="#BA7517"/>
<path d="M175 300 L262 330 M418 330 L530 420" stroke="#1D9E75"/>
<path d="M175 300 L262 400 M418 400 L530 465" stroke="#378ADD"/>
</g>
<g fill="none" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<circle cx="140" cy="268" r="18"/>
<path d="M105 300 L175 300 L165 430 L115 430 Z"/>
<path d="M105 300 L95 370 L90 430"/>
<path d="M125 430 L120 510 M155 430 L160 510"/>
<path d="M175 300 L182 205 L186 115 L188 92 L194 62 M186 106 L174 78"/>
</g>
<circle cx="175" cy="300" r="13" fill="none" stroke="#378ADD" stroke-width="1.5"/>
<circle class="c-teal" cx="175" cy="300" r="6"/>
<circle class="c-amber" cx="182" cy="205" r="6"/>
<circle class="c-purple" cx="186" cy="115" r="6"/>
<circle class="c-coral" cx="188" cy="92" r="6"/>
<circle class="c-pink" cx="184" cy="70" r="6"/>
<g class="c-gray">
<rect x="485" y="450" width="90" height="30" rx="4"/>
<rect x="520" y="300" width="20" height="120" rx="4"/>
<rect x="512" y="405" width="36" height="45" rx="4"/>
<rect x="521" y="205" width="18" height="95" rx="4"/>
<rect x="522" y="160" width="16" height="45" rx="4"/>
<rect x="521" y="105" width="6" height="55" rx="2"/>
<rect x="533" y="112" width="6" height="48" rx="2"/>
</g>
<circle class="c-pink" cx="530" cy="130" r="6"/>
<circle class="c-coral" cx="530" cy="180" r="6"/>
<circle class="c-purple" cx="530" cy="205" r="6"/>
<circle class="c-amber" cx="530" cy="300" r="6"/>
<circle class="c-teal" cx="530" cy="420" r="6"/>
<circle class="c-blue" cx="530" cy="465" r="6"/>
<g class="c-pink"><rect x="262" y="58" width="156" height="44" rx="8"/><text class="th" x="340" y="76" text-anchor="middle">gripper</text><text class="ts" x="340" y="94" text-anchor="middle">pinch thumb + index</text></g>
<g class="c-coral"><rect x="262" y="113" width="156" height="44" rx="8"/><text class="th" x="340" y="131" text-anchor="middle">wrist_roll</text><text class="ts" x="340" y="149" text-anchor="middle">twist forearm</text></g>
<g class="c-purple"><rect x="262" y="168" width="156" height="44" rx="8"/><text class="th" x="340" y="186" text-anchor="middle">wrist_flex</text><text class="ts" x="340" y="204" text-anchor="middle">bend hand fwd / back</text></g>
<g class="c-amber"><rect x="262" y="223" width="156" height="44" rx="8"/><text class="th" x="340" y="241" text-anchor="middle">elbow_flex</text><text class="ts" x="340" y="259" text-anchor="middle">bend elbow</text></g>
<g class="c-teal"><rect x="262" y="308" width="156" height="44" rx="8"/><text class="th" x="340" y="326" text-anchor="middle">shoulder_lift</text><text class="ts" x="340" y="344" text-anchor="middle">raise / lower arm</text></g>
<g class="c-blue"><rect x="262" y="378" width="156" height="44" rx="8"/><text class="th" x="340" y="396" text-anchor="middle">shoulder_pan</text><text class="ts" x="340" y="414" text-anchor="middle">swing arm sideways</text></g>
<text class="ts" x="340" y="545" text-anchor="middle">Both straight up is the shared zero. From there, 1° of yours = 1° of the robot's.</text>
</svg>
