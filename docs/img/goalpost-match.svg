<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 540" role="img"><title>Goalpost pose axis matching</title>
<style>
svg{--s:#5F5E5A;--t:#888780;--b:#B4B2A9;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{fill:#2C2C2A}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.c-gray>rect{fill:#F1EFE8;stroke:#888780;stroke-width:1}
circle.c-pink,.c-pink>rect{fill:#FBEAF0;stroke:#D4537E;stroke-width:1.5}.c-pink text{fill:#72243E}
circle.c-coral,.c-coral>rect{fill:#FAECE7;stroke:#D85A30;stroke-width:1.5}.c-coral text{fill:#712B13}
circle.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#7F77DD;stroke-width:1.5}.c-purple text{fill:#3C3489}
circle.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#BA7517;stroke-width:1.5}.c-amber text{fill:#633806}
circle.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#1D9E75;stroke-width:1.5}.c-teal text{fill:#085041}
circle.c-blue,.c-blue>rect{fill:#E6F1FB;stroke:#378ADD;stroke-width:1.5}.c-blue text{fill:#0C447C}
</style>
<rect width="680" height="540" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="36" text-anchor="middle">You, facing the camera</text>
<text class="ts" x="170" y="56" text-anchor="middle">goalpost pose, palm facing out</text>
<text class="th" x="540" y="36" text-anchor="middle">SO-101, side view</text>
<text class="ts" x="540" y="56" text-anchor="middle">same shape = the match pose</text>
<g fill="none" stroke="#5F5E5A" stroke-linecap="round" stroke-linejoin="round">
<circle cx="285" cy="250" r="20" stroke-width="3"/>
<path d="M250 300 L320 300 L310 420 L260 420 Z" stroke-width="3"/>
<path d="M250 300 L120 300 L120 170 L62 170" stroke-width="9"/>
</g>
<g fill="none" stroke="#B4B2A9" stroke-linecap="round" stroke-linejoin="round">
<path d="M500 350 L500 300 L620 300 L620 170 L565 170" stroke-width="16"/>
<path d="M565 162 L535 162 M565 178 L540 178" stroke-width="5"/>
</g>
<g class="c-gray"><rect x="470" y="350" width="60" height="45" rx="4"/></g>
<g fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 3"><path d="M250 225 L250 380"/><path d="M500 405 L500 240"/></g>
<g fill="none" stroke="#D85A30" stroke-width="1.5"><path d="M110 150 L66 150" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M606 146 L560 146" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
<circle class="c-teal" cx="250" cy="300" r="9"/><circle cx="250" cy="300" r="2.5" fill="#1D9E75"/>
<circle class="c-amber" cx="120" cy="300" r="9"/><circle cx="120" cy="300" r="2.5" fill="#BA7517"/>
<circle class="c-purple" cx="120" cy="170" r="9"/><circle cx="120" cy="170" r="2.5" fill="#7F77DD"/>
<circle class="c-pink" cx="62" cy="170" r="6"/>
<circle class="c-teal" cx="500" cy="300" r="9"/><circle cx="500" cy="300" r="2.5" fill="#1D9E75"/>
<circle class="c-amber" cx="620" cy="300" r="9"/><circle cx="620" cy="300" r="2.5" fill="#BA7517"/>
<circle class="c-purple" cx="620" cy="170" r="9"/><circle cx="620" cy="170" r="2.5" fill="#7F77DD"/>
<circle class="c-pink" cx="545" cy="170" r="6"/>
<circle class="c-blue" cx="500" cy="395" r="6"/>
<text class="ts" x="88" y="136" text-anchor="middle">roll axis</text>
<text class="ts" x="62" y="196" text-anchor="middle">pinch</text>
<text class="ts" x="138" y="174">wrist</text>
<text class="ts" x="120" y="330" text-anchor="middle">elbow</text>
<text class="ts" x="215" y="324" text-anchor="end">shoulder</text>
<text class="ts" x="240" y="372" text-anchor="end">pan axis (vertical)</text>
<text class="ts" x="583" y="132" text-anchor="middle">roll axis</text>
<text class="ts" x="548" y="198" text-anchor="middle">gripper</text>
<text class="ts" x="604" y="232" text-anchor="end">wrist_flex</text>
<text class="ts" x="604" y="286" text-anchor="end">elbow_flex</text>
<text class="ts" x="484" y="286" text-anchor="end">shoulder_lift</text>
<text class="ts" x="500" y="425" text-anchor="middle">shoulder_pan axis</text>
<circle class="c-gray" cx="60" cy="462" r="8" fill="#F1EFE8" stroke="#888780"/><circle cx="60" cy="462" r="2.5" fill="#888780"/>
<text class="ts" x="78" y="466">axis points at the camera: shoulder, elbow and wrist are all parallel</text>
<path d="M50 490 L70 490" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="78" y="494">vertical axis: swing the whole arm toward or away from the camera = base</text>
<path d="M50 518 L70 518" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="78" y="522">along the hand: roll</text>
</svg>
