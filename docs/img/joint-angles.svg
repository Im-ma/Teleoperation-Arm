<text class="ts" x="340" y="360" text-anchor="middle">knuckle line tilt</text><text class="ts" x="340" y="378" text-anchor="middle">0° = palm to camera</text>
<text class="ts" x="543" y="360" text-anchor="middle">tip gap ÷ hand size</text><text class="ts" x="543" y="378" text-anchor="middle">pinch closes the jaws</text>
