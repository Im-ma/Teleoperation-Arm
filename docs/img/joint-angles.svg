<text class="ts" x="146" y="272">forward</text>
<text class="ts" x="137" y="165" text-anchor="middle">upper arm vs vertical</text><text class="ts" x="137" y="183" text-anchor="middle">0° = straight up</text>
<text class="ts" x="340" y="165" text-anchor="middle">forearm vs upper arm</text><text class="ts" x="340" y="183" text-anchor="middle">0° = arm straight</text>
