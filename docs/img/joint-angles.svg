<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 435" role="img"><title>How each joint angle is measured</title>
<style>
svg{--s:#5F5E5A;--t:#888780;--b:#B4B2A9;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{fill:#2C2C2A}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.c-gray>rect{fill:#F1EFE8;stroke:#888780;stroke-width:1}
